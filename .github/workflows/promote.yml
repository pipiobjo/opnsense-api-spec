#
# The only way to main (ADR 0012). Work lands on the branch "dev"; this
# workflow runs the code gates and the whole pipeline as a dry run twice on
# that exact commit (once as it plans itself, once as a day without
# changes, where no contract job runs), then fast-forwards
# main. The first dry run also uploads the newest release to a draft
# release, checks names and checksums as GitHub stored them, and deletes
# the draft (tools/ci/roundtrip.sh). The nightly run therefore only ever
# runs code that passed all of this.
#
# Anyone with write access could still push to main; a live pipeline run
# then refuses to publish that commit (pipeline.yml, "Only promoted commits
# publish"). A failure here notifies nobody at once: main stays where it
# was, and after 7 days the watchdog reports it (tools/ci/alerts.sh,
# condition "promotion").
name: promote

on:
  push:
    branches: [dev]
  # merges by automerge.yml are pushes by the workflow token, which start no
  # workflow; automerge.yml dispatches this one instead
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  dry-run:
    needs: ci
    uses: ./.github/workflows/pipeline.yml
    # the called jobs declare these; nothing is written in a dry run
    # (LIVE is false for every event but schedule and a manual publish)
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: write
    with:
      skip-contract: false
      roundtrip: true
  dry-run-no-change:
    needs: ci
    uses: ./.github/workflows/pipeline.yml
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: write
    with:
      skip-contract: true
  main:
    needs: [dry-run, dry-run-no-change]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fast-forward main to the tested commit
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main "$GITHUB_SHA" || { echo "::error::main is not an ancestor of $GITHUB_SHA; rebase dev on main"; exit 1; }
          git push origin "$GITHUB_SHA:refs/heads/main"
          echo "main -> ${GITHUB_SHA:0:12}" >> "$GITHUB_STEP_SUMMARY"
