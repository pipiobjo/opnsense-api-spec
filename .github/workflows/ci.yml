#
# Code gates on every push and pull request: vet, unit tests, golden and
# determinism tests against the real golden releases (fetched, so a missing
# input fails instead of skipping). Publishing is pipeline.yml; pushes to
# dev run this through promote.yml.
name: ci

on:
  pull_request:
  # promote.yml runs these gates before every move of main
  workflow_call:

permissions:
  contents: read

# explicit shell: "bash -eo pipefail"; the implicit default has no pipefail,
# so "verify | tee" would pass when verify fails
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          minimum_release_age: 7d # only mise releases at least a week old
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pkg
          key: pkg-golden-${{ hashFiles('internal/assemble/testdata/golden/*.json') }}
      - name: Gates (format, vet, tests with golden releases, script tests, coverage)
        run: tools/ci/gates.sh
      # reachable vulnerabilities with a fix fail; without a fix: warning.
      # Not in the daily pipeline: a new vulnerability in a dependency does
      # not make published data wrong, so it must not stop publishing.
      - name: Vulnerabilities (govulncheck)
        run: tools/ci/vulncheck.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 30
