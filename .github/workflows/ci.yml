#
# Code gates on every push and pull request: vet, unit tests, golden and
# determinism tests against the real golden releases (fetched, so a missing
# input fails instead of skipping). Publishing is pipeline.yml; pushes to
# dev run this through promote.yml.
name: ci

on:
  pull_request:
  # promote.yml runs these gates before every move of main
  workflow_call:

permissions:
  contents: read

# explicit shell: "bash -eo pipefail"; the implicit default has no pipefail,
# so "verify | tee" would pass when verify fails
defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pkg
          key: pkg-golden-${{ hashFiles('internal/assemble/testdata/golden/*.json') }}
      - name: Fetch golden releases
        run: tools/ci/golden-fetch.sh
      - name: Vet and test
        env:
          GOLDEN_REQUIRED: "1"
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::gofmt"; exit 1; }
          go vet ./...
          go test -count=1 ./...
      - name: Script tests
        run: tools/ci/alerts_test.sh
