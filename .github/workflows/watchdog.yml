#
# The one signal to a person (docs/operations.md, ADR 0012): daily, opens
# one issue labelled "needs-you" when publishing has been stale for 7 days,
# pipeline.yml is disabled, or a new release lost typing; edits it while
# that lasts and closes it when it is over. A schedule GitHub disabled for
# inactivity is re-enabled without a message.
#
# The pipeline's keepalive job re-enables this workflow, and this one the
# pipeline, so neither is lost to the 60-day inactivity rule alone.
name: watchdog

on:
  schedule:
    - cron: "41 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      actions: write # re-enable pipeline.yml after GitHub disabled it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check
        run: tools/ci/alerts.sh check
