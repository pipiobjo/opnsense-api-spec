#
# Signals no failing run can send (docs/operations.md):
#   watchdog  every day: pipeline.yml still enabled and its last successful
#             scheduled run younger than 3 days; otherwise one issue
#             labelled "watchdog", closed again when it recovers. A schedule
#             GitHub disabled for inactivity is re-enabled.
#   digest    Mondays (or on request): one issue labelled "digest",
#             rewritten in place with the last 7 days.
# The pipeline's keepalive job re-enables this workflow, and this one the
# pipeline, so neither is lost to the 60-day inactivity rule alone.
name: watchdog

on:
  schedule:
    - cron: "41 17 * * *"
  workflow_dispatch:
    inputs:
      digest:
        description: Also rewrite the weekly digest now
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

defaults:
  run:
    shell: bash

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      actions: write # re-enable pipeline.yml after GitHub disabled it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Watchdog
        run: tools/ci/alerts.sh watchdog
      - name: Weekly digest
        env:
          ON_REQUEST: ${{ inputs.digest }}
        run: |
          if [ "$ON_REQUEST" = true ] || [ "$(date -u +%u)" = 1 ]; then
            tools/ci/alerts.sh digest
          else
            echo "digest: Mondays only"
          fi
