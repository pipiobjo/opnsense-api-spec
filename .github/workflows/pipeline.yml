# SPDX-FileCopyrightText: 2026 opnsense-api-spec contributors
# SPDX-License-Identifier: BSD-2-Clause
#
# Daily pipeline (ADR 0008, docs/roadmap.md "Target pipeline"):
#
#   build     restore state -> gates (vet, tests, golden) -> matrix of all
#             series -> client smoke test -> plan of contract tests
#   contract  per planned release: throwaway VM (KVM, else software
#             emulation), update to the release, all API plugins, verify;
#             coverage reported (floor only with check-coverage, promote.yml);
#             a plugin that does not install fails the job after its result
#             is kept
#   prepare   after build, whatever the contract jobs did (ADR 0008:
#             publishing per release): merges every contract result there
#             is, index, SBOMs, capability data, the publishing plan
#             (tools/ci/publish.sh plan); read-only token
#   upload    live runs only: GitHub releases with SHA256SUMS and provenance
#             attestation, a check of what was published (downloaded
#             without credentials), state, capability data. Runs gh and
#             shell only, nothing of the build (ADR 0015)
#   check-catalog
#             every run: the published capability data as a consumer gets
#             it, data_id recomputed (read-only token; runs the generator)
#   roundtrip dry runs from promote.yml: the newest release through a draft
#             release that is deleted again (tools/ci/roundtrip.sh)
#   complete  fails the run when a job that had to run did not, or a
#             planned release is still unverified (it was published as a
#             pre-release)
#   report    on any failure: the findings on the run's summary page;
#             nobody is notified (ADR 0012)
#
# Live only on the schedule, or by hand with "publish" on. promote.yml
# calls this workflow as a dry run before a commit reaches main.
# watchdog.yml opens the one "needs-you" issue when publishing has been
# stale for 7 days.
#
# No secrets: the only token is the workflow's own GITHUB_TOKEN, given to
# the steps that call gh and to no step that runs the generator or its
# dependencies; write rights only in jobs that run no Go (ADR 0015). The
# test VM is isolated as described in tools/testvm.sh (ADR 0004).
name: pipeline

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_call:
    inputs:
      # never true from promote.yml; declared so the expressions below have
      # the same inputs under every trigger
      publish:
        type: boolean
        default: false
      verify:
        type: string
        default: ""
      skip-contract:
        description: Plan no contract tests (the path of a day without changes)
        type: boolean
        default: false
      roundtrip:
        description: Upload the newest release to a draft, check it as published, delete it
        type: boolean
        default: false
      check-coverage:
        description: Enforce the floor of the contract test coverage (promote.yml)
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: Publish (off = dry run, the publish job only prints what it would do)
        type: boolean
        default: true
      verify:
        description: Additional releases to contract-test, comma-separated (e.g. 26.7.5,26.1.6)
        type: string
        default: ""
      skip-contract:
        description: Plan no contract tests
        type: boolean
        default: false
      roundtrip:
        description: Dry run only - upload the newest release to a draft, check it as published, delete it
        type: boolean
        default: false
      # the two overrides of the state checks (tools/ci/state.sh); each is
      # for one run a person decided on, never for the schedule
      accept-unattested-state:
        description: Build on a state without provenance attestation (once, after a repair by hand)
        type: boolean
        default: false
      allow-fewer-verified:
        description: Save a state with fewer contract test records than the previous one
        type: boolean
        default: false
      check-coverage:
        description: Enforce the floor of the contract test coverage (as promote.yml does)
        type: boolean
        default: false

permissions:
  contents: read

# live runs share one group (one state); dry runs run beside them and
# beside each other (a queued run in a shared group would be cancelled by
# the next one)
concurrency:
  group: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)) && 'pipeline' || format('pipeline-dry-{0}-{1}', github.run_id, inputs.skip-contract) }}
  cancel-in-progress: false

env:
  # The only switch between publishing and a dry run. Spelled out so that a
  # call from promote.yml (event "push" or "workflow_dispatch" of the
  # caller, no "publish" input) is never live.
  LIVE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}

# explicit shell: "bash -eo pipefail"; the implicit default has no pipefail,
# so "verify | tee" would pass when verify fails
defaults:
  run:
    shell: bash

jobs:
  # GitHub disables scheduled workflows of public repositories after 60 days
  # without repository activity, and nothing would report it. Re-enabling
  # the workflow through the API on every run keeps the schedule alive
  # without dummy commits (the approach of the widely used keepalive
  # actions; to be confirmed by the first 60 quiet days).
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow and the watchdog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pipeline.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/watchdog.yml/enable"

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      attestations: read # the provenance of the state (tools/ci/state.sh restore)
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          minimum_release_age: 7d # only mise releases at least a week old
      # package downloads (~0.45 GB, free Actions cache of 10 GB); restore
      # and save are separate so a failed run keeps what it downloaded.
      # Keyed by content: a new entry only when the downloads changed (a
      # key per run filled the 10 GB with copies and pushed out the VM
      # images, finding OPS-8)
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pkgcache
        with:
          path: .cache/pkg
          key: pkg-v2-
          restore-keys: pkg-v2-
      # main moves only through promote.yml (ADR 0012). A live run on a
      # commit that did not pass it publishes nothing; after 7 days the
      # watchdog says so.
      - name: Only promoted commits publish
        if: env.LIVE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -w promote.yml -c "$GITHUB_SHA" -s success -L 1 --json databaseId --jq length)
          [ "$n" -gt 0 ] || { echo "::error::$GITHUB_SHA did not pass promote.yml; push to dev instead of main"; exit 1; }
      - name: Restore state
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_ACCEPT_UNATTESTED: ${{ inputs.accept-unattested-state == true && '1' || '' }}
        run: tools/ci/state.sh restore
      - name: Gates (format, vet, tests with golden releases, script tests)
        run: tools/ci/gates.sh
      - name: Matrix (all series)
        run: |
          rc=0
          go run ./cmd/opnsense-api-spec matrix -series all 2>&1 | tee .cache/ci/matrix.log || rc=$?
          sed -n 's/^warning: /::warning::/p; s/^error: /::error::/p' .cache/ci/matrix.log
          {
            echo '### Matrix'; echo '```'
            grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)? +(build|status|up-to-date|kept|unavailable|failed) ' .cache/ci/matrix.log || true
            echo '```'
            grep -E '^(warning|error): ' .cache/ci/matrix.log | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Package cache key (names and sizes of the downloads)
        id: pkgkey
        if: always()
        run: echo "key=pkg-v2-$(find .cache/pkg -type f ! -name '*.tmp' -printf '%P %s\n' 2>/dev/null | LC_ALL=C sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Save package cache
        if: always() && steps.pkgkey.outputs.key != steps.pkgcache.outputs.cache-matched-key
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pkg
          key: ${{ steps.pkgkey.outputs.key }}
      - name: Client smoke test (newest release per series)
        run: |
          for rel in $(jq -r '.releases | group_by(.series) | map(last.release) | .[]' dist/index.json); do
            tools/client-smoke.sh "$rel"
          done
      - name: Plan contract tests
        id: plan
        env:
          EXTRA: ${{ inputs.verify }}
          SKIP: ${{ inputs.skip-contract }}
        # the generator checks every name (pkgrepo.ValidRelease) and that a
        # requested release is built; nothing else reaches the matrix
        run: |
          only=false
          [ "$SKIP" = true ] && only=true && echo "contract tests skipped on request"
          plan=$(go run ./cmd/opnsense-api-spec plan -matrix -verify "${EXTRA:-}" -only-requested="$only")
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "### Contract tests planned" >> "$GITHUB_STEP_SUMMARY"
          jq -r 'if length == 0 then "none (all newest releases verified)" else .[] | "- \(.release)" end' <<<"$plan" >> "$GITHUB_STEP_SUMMARY"
      - name: Pack dist
        run: |
          cp .cache/ci/index.prev.json dist/.index.prev.json
          tar -C dist -cf - . | zstd -q -10 -T0 > dist.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist.tar.zst
          retention-days: 7

  contract:
    needs: build
    if: needs.build.outputs.plan != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.build.outputs.plan) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          minimum_release_age: 7d # only mise releases at least a week old
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - name: Unpack dist
        run: mkdir -p dist && zstd -dc dist.tar.zst | tar -C dist -xf - && rm dist.tar.zst
      - name: Test VM ${{ matrix.release }} with all plugins
        id: vm
        uses: ./.github/actions/testvm
        with:
          series: ${{ matrix.series }}
          release: ${{ matrix.release }}
          plugins: all
          # the contract test records what was installed; a missing plugin is
          # reported, not fatal
          require-plugins: "false"
      - name: Contract test ${{ matrix.release }}
        env:
          RELEASE: ${{ matrix.release }}
        run: |
          tools/testvm.sh contract "dist/$RELEASE/opnsense-$RELEASE.ir.json" 2>&1 | tee .cache/vm/verify.log
      # which code of the contract test ran against the instance. Reported
      # in every run; the floor (tools/ci/coverage-floor.txt) is enforced
      # only where code changes are tested (promote.yml), never on the
      # unattended publishing path, where it would hold back data for a
      # measurement of the VM's behaviour (decision of 2026-11-24)
      - name: Contract test coverage
        if: always() && steps.vm.outcome == 'success'
        env:
          COVERAGE_ENFORCE: ${{ inputs.check-coverage == true && '1' || '0' }}
        run: tools/testvm.sh contract-coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-contract-${{ matrix.release }}
          path: coverage/
          retention-days: 30
      - name: Stop test VM
        if: always()
        uses: ./.github/actions/testvm
        with:
          command: stop
      - name: Summary
        if: always()
        env:
          PLUGINS: ${{ steps.vm.outputs.plugins }}
          FAILED: ${{ steps.vm.outputs.failed }}
          RELEASE: ${{ matrix.release }}
          ACCEL: ${{ steps.vm.outputs.acceleration || '-' }}
        run: |
          f="dist/$RELEASE/opnsense-$RELEASE.verified.json"
          {
            echo "### $RELEASE (instance $(jq -r '.instance_version // "-"' "$f" 2>/dev/null))"
            echo "acceleration: $ACCEL"
            echo "plugins: $(tr ',' '\n' <<<"$PLUGINS" | grep -c .) installed, failed: ${FAILED:-none}"
            echo '```'
            jq -r '[.results[] | "\(.check)/\(.status)"] | group_by(.) | map("\(.[0]) \(length)") | .[]' "$f" 2>/dev/null || echo "no results"
            echo '```'
            # accepted entries that covered nothing (set by verify.ApplyAccepted)
            jq -r '.unused_accepted[]? | "- accepted entry unused (candidate for removal): `\(.)`"' "$f" 2>/dev/null || true
            # what fails is decided by the generator (verify.Status), not here
            [ -f "$f" ] && go run ./cmd/opnsense-api-spec failures "$f" | tee .cache/vm/failures.md
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p out
          echo "$RELEASE" > out/release
          cp "$f" "dist/$RELEASE/opnsense-$RELEASE.openapi.json" out/ 2>/dev/null || true
          cp .cache/vm/verify.log .cache/vm/console.log .cache/vm/proxy.log .cache/vm/failures.md .cache/vm/install-*.log out/ 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verified-${{ matrix.release }}
          path: out/
          retention-days: 14
      # A plugin the VM could not install leaves its endpoints untested:
      # the release is published as not verified (prepare runs anyway), and
      # this job stays red so that a lasting fault reaches the watchdog
      # after 7 days (ADR 0008).
      - name: Every plugin installed
        if: always() && steps.vm.outcome == 'success'
        env:
          FAILED: ${{ steps.vm.outputs.failed }}
        run: |
          if [ -n "$FAILED" ]; then
            echo "::error::not installable on the test VM, so untested in this release: $FAILED"
            exit 1
          fi

  # Everything that runs the generator and its dependencies, with a token
  # that can only read; the result goes to the upload job as an artifact.
  # Runs whatever the contract jobs did: each release is published with
  # the contract result it has (ADR 0008, publishing per release); a
  # failed release stays or becomes a pre-release and the run stays red.
  prepare:
    needs: [build, contract]
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.contract.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      catalog-changed: ${{ steps.catalog.outputs.changed }}
      unverified: ${{ steps.verified.outputs.unverified }}
    env:
      # SBOMs: always in dry runs (built, checked, round trip); in a live run
      # only when the repository variable SBOM_PUBLISH is "true"
      # (job env cannot read the workflow's LIVE, so it is spelled out)
      SBOM: ${{ ((github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.publish == true)) || vars.SBOM_PUBLISH == 'true') && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          minimum_release_age: 7d # only mise releases at least a week old
      # Explicit paths: download-artifact unpacks a single match of a pattern
      # into the target directory itself and several matches into
      # subdirectories, so nothing below may depend on the number of matches
      # (a run without contract jobs has none; ADR 0012).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: .ci/in/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.contract.result != 'skipped'
        with:
          pattern: verified-*
          path: .ci/in/verified
      - name: Merge contract test results
        run: |
          mkdir -p dist .cache/ci && zstd -dc .ci/in/dist/dist.tar.zst | tar -C dist -xf -
          mv dist/.index.prev.json .cache/ci/index.prev.json
          # a leg that failed before verify wrote a result has none: its
          # release keeps the result it had
          if [ -d .ci/in/verified ]; then
            while IFS= read -r f; do
              d=$(dirname "$f"); rel=$(cat "$f")
              [ -d "dist/$rel" ] || { echo "::error::contract result for unknown release $rel"; exit 1; }
              if [ -f "$d/opnsense-$rel.verified.json" ] && [ -f "$d/opnsense-$rel.openapi.json" ]; then
                cp "$d/opnsense-$rel.verified.json" "$d/opnsense-$rel.openapi.json" "dist/$rel/"
                echo "merged contract test result of $rel"
              else
                echo "::warning::no contract test result for $rel; it keeps its previous one"
              fi
            done < <(find .ci/in/verified -name release -type f)
          fi
          go run ./cmd/opnsense-api-spec index
      # SBOMs (ADR 0013) are built and checked in every dry run; a live run
      # publishes them only when the repository variable SBOM_PUBLISH is
      # "true"
      - name: SBOM per release
        if: env.SBOM == '1'
        run: go run ./cmd/opnsense-api-spec sbom
      # Not a gate any more (ADR 0008, publishing per release): a planned
      # release that is still unverified is published as a pre-release,
      # and the job "complete" fails the run, so it cannot pass silently.
      - name: Planned releases still unverified
        id: verified
        env:
          PLAN: ${{ needs.build.outputs.plan }}
        run: |
          left=$(go run ./cmd/opnsense-api-spec plan)
          still=$(jq -cn --argjson p "$PLAN" --argjson l "$left" '[$p[].release] as $planned | $l | map(select(. as $r | $planned | index($r)))')
          echo "unverified=$still" >> "$GITHUB_OUTPUT"
          if [ "$still" != "[]" ]; then
            echo "::warning::still not verified after the contract tests, published as pre-releases: $still"
            {
              echo '### Planned releases still unverified (published as pre-releases)'
              jq -r --argjson s "$still" '.releases[] | select(.release as $r | $s | index($r))
                | "- \(.release): \(.verified.failed // "no" ) failed, untested \(.verified.untested_packages // [] | join(", ")), not installable \(.verified.not_installable // [] | join(", "))"' dist/index.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # Reads GitHub (which releases exist, their checksums and asset
      # names; read-only token) and stages what upload will publish. The
      # generator SBOM inside runs in an isolated container without the
      # token. "upload --dry-run" checks the plan the way the upload job
      # will read it.
      - name: Publishing plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/ci/publish.sh plan
          tools/ci/publish.sh upload --dry-run
          {
            echo '### Publishing plan'
            echo '```'
            awk -F'\t' '{print $2, "opnsense-" $1, "pre-release=" $3}' .cache/ci/upload/releases.tsv
            cat .cache/ci/upload/generator.env
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Pack state
        env:
          STATE_ALLOW_FEWER_VERIFIED: ${{ inputs.allow-fewer-verified == true && '1' || '' }}
        run: tools/ci/state.sh pack
      - name: Build capability data
        run: tools/ci/catalog.sh build
      - name: Capability data changed?
        id: catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "changed=$(tools/ci/catalog.sh changed)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog
          path: .cache/ci/catalog/
          retention-days: 14
      # one archive, so the next jobs see exactly these paths
      - name: Hand over to the upload job
        run: |
          parts=(.cache/ci/upload .cache/ci/sums .cache/ci/state .cache/ci/catalog .cache/ci/published.txt)
          [ -d .cache/ci/generator ] && parts+=(.cache/ci/generator)
          tar -cf publish-input.tar "${parts[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-input
          path: publish-input.tar
          retention-days: 7

  # Live runs only (a job-level condition, so no dry run ever gets these
  # rights): publishes what prepare decided, with gh and shell only; no Go,
  # no mise, nothing of the build runs here.
  upload:
    needs: [prepare]
    # !cancelled(): without it a skipped contract job (a day without
    # changes) would skip this job too; "complete" fails a run where it
    # should have run and did not
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write # provenance attestations (keyless, Sigstore)
      attestations: write
    env:
      # Capability data (docs/capabilities.md) is published only when the
      # repository variable CATALOG_PUBLISH is "true"; otherwise it is
      # built, checked and kept as a workflow artifact.
      CATALOG_LIVE: ${{ vars.CATALOG_PUBLISH == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-input
          path: .ci/in
      # prepare ran the build and its dependencies: its archive may only
      # add files below .cache/ci, never replace a script run below
      - name: Unpack
        run: tools/ci/unpack-input.sh .ci/in/publish-input.tar
      - name: Publish releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/publish.sh upload
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: hashFiles('.cache/ci/sums/*/SHA256SUMS') != ''
        with:
          subject-path: .cache/ci/sums/*/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: hashFiles('.cache/ci/generator/SHA256SUMS') != ''
        with:
          subject-path: .cache/ci/generator/*
      # before the state: a failure here leaves the state as it was, so the
      # next run publishes these releases again (and deletes stray assets)
      - name: Check what was published
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/check-published.sh releases
      # the next run builds on the state only with this attestation
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            .cache/ci/state/dist.tar.zst
            .cache/ci/state/index.json
      - name: Save state
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/state.sh save
      # after the state: a problem with the capability data must not keep
      # the releases from being recorded
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.CATALOG_LIVE == 'true' && needs.prepare.outputs.catalog-changed == 'true'
        with:
          subject-path: |
            .cache/ci/catalog/catalog.json
            .cache/ci/catalog/capabilities.tar.zst
            .cache/ci/catalog/SHA256SUMS
      - name: Publish capability data
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/catalog.sh publish ${{ env.CATALOG_LIVE != 'true' && '--dry-run' || '' }}

  # The capability data as a consumer gets it, with its data_id recomputed
  # from the content by the generator: after a live upload the new state,
  # in a dry run what is public now. Runs Go, so not in the upload job
  # (ADR 0015); its token can only read.
  check-catalog:
    needs: [prepare, upload]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.upload.result == 'success' || needs.upload.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          minimum_release_age: 7d # only mise releases at least a week old
      - name: Check the published capability data
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/check-published.sh catalog

  # Dry runs from promote.yml: the real publishing round trip through a
  # draft release that is deleted again. May write releases (drafts), has
  # no id-token, runs nothing of the build.
  roundtrip:
    needs: [prepare]
    if: >-
      !cancelled() && needs.prepare.result == 'success' && inputs.roundtrip == true &&
      !(github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-input
          path: .ci/in
      - name: Unpack
        run: |
          tools/ci/unpack-input.sh .ci/in/publish-input.tar
          mkdir -p .ci/dist && zstd -dc .cache/ci/state/dist.tar.zst | tar -C .ci/dist --no-same-owner -xf -
          if [ -n "$(find .ci/dist ! -type f ! -type d)" ]; then echo "::error::dist from prepare contains links"; exit 1; fi
      - name: Publishing round trip (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/roundtrip.sh .ci/dist

  # A job skipped by a wrong condition looks like a pass (on 2026-11-18
  # the round trip was skipped this way and the promotion still moved
  # main). This fails the run when the upload of a live run or a requested
  # round trip did not succeed.
  complete:
    needs: [prepare, upload, roundtrip]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job that had to run did, every planned release is verified
        env:
          UPLOAD: ${{ needs.upload.result }}
          ROUNDTRIP: ${{ needs.roundtrip.result }}
          WANT_ROUNDTRIP: ${{ inputs.roundtrip }}
          UNVERIFIED: ${{ needs.prepare.outputs.unverified }}
        run: |
          echo "live=$LIVE upload=$UPLOAD roundtrip requested=$WANT_ROUNDTRIP roundtrip=$ROUNDTRIP unverified=${UNVERIFIED:-[]}"
          rc=0
          if [ "$LIVE" = true ] && [ "$UPLOAD" != success ]; then
            echo "::error::live run, but the upload job is '$UPLOAD'"; rc=1
          fi
          if [ "$LIVE" != true ] && [ "$WANT_ROUNDTRIP" = true ] && [ "$ROUNDTRIP" != success ]; then
            echo "::error::round trip requested, but the roundtrip job is '$ROUNDTRIP'"; rc=1
          fi
          if [ "${UNVERIFIED:-[]}" != "[]" ]; then
            echo "::error::planned releases still unverified after the contract tests (published as pre-releases): $UNVERIFIED"; rc=1
          fi
          exit "$rc"

  report:
    needs: [keepalive, build, contract, prepare, upload, check-catalog, roundtrip, complete]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: verified-*
          path: .ci/in/verified
      - name: Failure report on the summary page
        env:
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: tools/ci/report.sh
