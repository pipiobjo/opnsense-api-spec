# SPDX-FileCopyrightText: 2026 opnsense-api-spec contributors
# SPDX-License-Identifier: BSD-2-Clause
#
# Daily pipeline (ADR 0008, docs/roadmap.md "Target pipeline"):
#
#   build     restore state -> gates (vet, tests, golden) -> matrix of all
#             series -> client smoke test -> plan of contract tests
#   contract  per planned release: throwaway VM (KVM, else software
#             emulation), update to the release, all API plugins, verify
#   publish   only if every job passed: index, GitHub releases with
#             SHA256SUMS and provenance attestation, state, then a check of
#             what was published, downloaded without credentials
#   report    on any failure: the findings on the run's summary page;
#             nothing is published and nobody is notified (ADR 0012)
#
# Live only on the schedule, or by hand with "publish" on. promote.yml
# calls this workflow as a dry run before a commit reaches main.
# watchdog.yml opens the one "needs-you" issue when publishing has been
# stale for 7 days.
#
# No secrets: the only token is the workflow's own GITHUB_TOKEN. The test VM
# is isolated as described in tools/testvm.sh (ADR 0004).
name: pipeline

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_call:
    inputs:
      # never true from promote.yml; declared so the expressions below have
      # the same inputs under every trigger
      publish:
        type: boolean
        default: false
      verify:
        type: string
        default: ""
      skip-contract:
        description: Plan no contract tests (the path of a day without changes)
        type: boolean
        default: false
      roundtrip:
        description: Upload the newest release to a draft, check it as published, delete it
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: Publish (off = dry run, the publish job only prints what it would do)
        type: boolean
        default: true
      verify:
        description: Additional releases to contract-test, comma-separated (e.g. 26.7.5,26.1.6)
        type: string
        default: ""
      skip-contract:
        description: Plan no contract tests
        type: boolean
        default: false

permissions:
  contents: read

# live runs share one group (one state); dry runs run beside them and
# beside each other (a queued run in a shared group would be cancelled by
# the next one)
concurrency:
  group: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)) && 'pipeline' || format('pipeline-dry-{0}-{1}', github.run_id, inputs.skip-contract) }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  # The only switch between publishing and a dry run. Spelled out so that a
  # call from promote.yml (event "push" or "workflow_dispatch" of the
  # caller, no "publish" input) is never live.
  LIVE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}

# explicit shell: "bash -eo pipefail"; the implicit default has no pipefail,
# so "verify | tee" would pass when verify fails
defaults:
  run:
    shell: bash

jobs:
  # GitHub disables scheduled workflows of public repositories after 60 days
  # without repository activity, and nothing would report it. Re-enabling
  # the workflow through the API on every run keeps the schedule alive
  # without dummy commits (the approach of the widely used keepalive
  # actions; to be confirmed by the first 60 quiet days).
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow and the watchdog
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pipeline.yml/enable"
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/watchdog.yml/enable"

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      # package downloads (~0.5 GB, free Actions cache); restore and save
      # are separate so a failed run keeps what it downloaded
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pkg
          key: pkg-${{ github.run_id }}
          restore-keys: pkg-
      # main moves only through promote.yml (ADR 0012). A live run on a
      # commit that did not pass it publishes nothing; after 7 days the
      # watchdog says so.
      - name: Only promoted commits publish
        if: env.LIVE == 'true'
        run: |
          n=$(gh run list -w promote.yml -c "$GITHUB_SHA" -s success -L 1 --json databaseId --jq length)
          [ "$n" -gt 0 ] || { echo "::error::$GITHUB_SHA did not pass promote.yml; push to dev instead of main"; exit 1; }
      - name: Restore state
        run: tools/ci/state.sh restore
      - name: Gates (format, vet, tests with golden releases, script tests)
        run: tools/ci/gates.sh
      - name: Matrix (all series)
        run: |
          rc=0
          go run ./cmd/opnsense-api-spec matrix -series all 2>&1 | tee .cache/ci/matrix.log || rc=$?
          sed -n 's/^warning: /::warning::/p; s/^error: /::error::/p' .cache/ci/matrix.log
          {
            echo '### Matrix'; echo '```'
            grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)? +(build|status|up-to-date|kept|unavailable|failed) ' .cache/ci/matrix.log || true
            echo '```'
            grep -E '^(warning|error): ' .cache/ci/matrix.log | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Save package cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pkg
          key: pkg-${{ github.run_id }}
      - name: Client smoke test (newest release per series)
        run: |
          for rel in $(jq -r '.releases | group_by(.series) | map(last.release) | .[]' dist/index.json); do
            tools/client-smoke.sh "$rel"
          done
      - name: Plan contract tests
        id: plan
        env:
          EXTRA: ${{ inputs.verify }}
          SKIP: ${{ inputs.skip-contract }}
        run: |
          planned=$(go run ./cmd/opnsense-api-spec plan)
          [ "$SKIP" = true ] && planned='[]' && echo "contract tests skipped on request"
          extra=$(jq -cn --arg e "${EXTRA:-}" '$e | split(",") | map(gsub("\\s"; "")) | map(select(. != ""))')
          for r in $(jq -r '.[]' <<<"$extra"); do
            [ -d "dist/$r" ] || { echo "::error::requested release $r is not built"; exit 1; }
          done
          plan=$(jq -cn --argjson a "$planned" --argjson b "$extra" \
            '$a + $b | unique | map({release: ., series: (split(".")[0:2] | join("."))})')
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "### Contract tests planned" >> "$GITHUB_STEP_SUMMARY"
          jq -r 'if length == 0 then "none (all newest releases verified)" else .[] | "- \(.release)" end' <<<"$plan" >> "$GITHUB_STEP_SUMMARY"
      - name: Pack dist
        run: |
          cp .cache/ci/index.prev.json dist/.index.prev.json
          tar -C dist -cf - . | zstd -q -10 -T0 > dist.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist.tar.zst
          retention-days: 7

  contract:
    needs: build
    if: needs.build.outputs.plan != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.build.outputs.plan) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - name: Unpack dist
        run: mkdir -p dist && zstd -dc dist.tar.zst | tar -C dist -xf - && rm dist.tar.zst
      - name: Test VM ${{ matrix.release }} with all plugins
        id: vm
        uses: ./.github/actions/testvm
        with:
          series: ${{ matrix.series }}
          release: ${{ matrix.release }}
          plugins: all
          # the contract test records what was installed; a missing plugin is
          # reported, not fatal
          require-plugins: "false"
      - name: Contract test ${{ matrix.release }}
        run: |
          tools/testvm.sh contract "dist/${{ matrix.release }}/opnsense-${{ matrix.release }}.ir.json" 2>&1 | tee .cache/vm/verify.log
      - name: Stop test VM
        if: always()
        uses: ./.github/actions/testvm
        with:
          command: stop
      - name: Summary
        if: always()
        env:
          PLUGINS: ${{ steps.vm.outputs.plugins }}
          FAILED: ${{ steps.vm.outputs.failed }}
        run: |
          f="dist/${{ matrix.release }}/opnsense-${{ matrix.release }}.verified.json"
          {
            echo "### ${{ matrix.release }} (instance $(jq -r '.instance_version // "-"' "$f" 2>/dev/null))"
            echo "acceleration: ${{ steps.vm.outputs.acceleration || '-' }}"
            echo "plugins: $(tr ',' '\n' <<<"$PLUGINS" | grep -c .) installed, failed: ${FAILED:-none}"
            echo '```'
            jq -r '[.results[] | "\(.check)/\(.status)"] | group_by(.) | map("\(.[0]) \(length)") | .[]' "$f" 2>/dev/null || echo "no results"
            echo '```'
            # what fails is decided by the generator (verify.Status), not here
            [ -f "$f" ] && go run ./cmd/opnsense-api-spec failures "$f" | tee .cache/vm/failures.md
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p out
          echo "${{ matrix.release }}" > out/release
          cp "$f" "dist/${{ matrix.release }}/opnsense-${{ matrix.release }}.openapi.json" out/ 2>/dev/null || true
          cp .cache/vm/verify.log .cache/vm/console.log .cache/vm/proxy.log .cache/vm/failures.md out/ 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verified-${{ matrix.release }}
          path: out/
          retention-days: 14

  publish:
    needs: [build, contract]
    if: >-
      always() && needs.build.result == 'success' &&
      (needs.contract.result == 'success' || needs.contract.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write # attestation of the catalog (keyless, Sigstore)
      attestations: write
    env:
      # Capability data (docs/capabilities.md) is published only when the
      # repository variable CATALOG_PUBLISH is "true" and the run publishes;
      # otherwise it is built, checked and kept as a workflow artifact.
      CATALOG_LIVE: ${{ vars.CATALOG_PUBLISH == 'true' && github.event_name == 'schedule' || (vars.CATALOG_PUBLISH == 'true' && github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      # Explicit paths: download-artifact unpacks a single match of a pattern
      # into the target directory itself and several matches into
      # subdirectories, so nothing below may depend on the number of matches
      # (a run without contract jobs has none; ADR 0012).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: .ci/in/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.contract.result == 'success'
        with:
          pattern: verified-*
          path: .ci/in/verified
      - name: Merge contract test results
        run: |
          mkdir -p dist .cache/ci && zstd -dc .ci/in/dist/dist.tar.zst | tar -C dist -xf -
          mv dist/.index.prev.json .cache/ci/index.prev.json
          if [ -d .ci/in/verified ]; then
            while IFS= read -r f; do
              d=$(dirname "$f"); rel=$(cat "$f")
              [ -d "dist/$rel" ] || { echo "::error::contract result for unknown release $rel"; exit 1; }
              cp "$d/opnsense-$rel.verified.json" "$d/opnsense-$rel.openapi.json" "dist/$rel/"
              echo "merged contract test result of $rel"
            done < <(find .ci/in/verified -name release -type f)
          fi
          go run ./cmd/opnsense-api-spec index
      - name: Gate (every planned release is verified now)
        env:
          PLAN: ${{ needs.build.outputs.plan }}
        run: |
          left=$(go run ./cmd/opnsense-api-spec plan)
          still=$(jq -cn --argjson p "$PLAN" --argjson l "$left" '[$p[].release] as $planned | $l | map(select(. as $r | $planned | index($r)))')
          if [ "$still" != "[]" ]; then
            echo "::error::still not verified after the contract tests: $still"
            jq --argjson s "$still" '.releases[] | select(.release as $r | $s | index($r)) | {release, current, verified}' dist/index.json
            exit 1
          fi
      - name: Publish releases
        run: tools/ci/publish.sh ${{ env.LIVE != 'true' && '--dry-run' || '' }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.LIVE == 'true' && hashFiles('.cache/ci/sums/*/SHA256SUMS') != ''
        with:
          subject-path: .cache/ci/sums/*/SHA256SUMS
      - name: Save state
        if: env.LIVE == 'true'
        run: tools/ci/state.sh save
      # after the state: a problem with the capability data must not keep
      # the releases from being recorded
      - name: Build capability data
        id: catalog
        run: |
          tools/ci/catalog.sh build
          echo "changed=$(tools/ci/catalog.sh changed)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog
          path: .cache/ci/catalog/
          retention-days: 14
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.CATALOG_LIVE == 'true' && steps.catalog.outputs.changed == 'true'
        with:
          subject-path: |
            .cache/ci/catalog/catalog.json
            .cache/ci/catalog/capabilities.tar.zst
            .cache/ci/catalog/SHA256SUMS
      - name: Publish capability data
        run: tools/ci/catalog.sh publish ${{ env.CATALOG_LIVE != 'true' && '--dry-run' || '' }}
      # dry runs from promote.yml: the real publishing round trip through a
      # draft release that is deleted again (tools/ci/roundtrip.sh)
      - name: Publishing round trip (draft)
        if: env.LIVE != 'true' && inputs.roundtrip == true
        run: tools/ci/roundtrip.sh dist
      # last: what consumers get, fetched without credentials
      - name: Check what was published
        if: env.LIVE == 'true'
        run: tools/ci/check-published.sh

  report:
    needs: [keepalive, build, contract, publish]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: verified-*
          path: .ci/in/verified
      - name: Failure report on the summary page
        env:
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: tools/ci/report.sh
