#
# Manual check that issues opened by the pipeline reach the maintainer:
# opens and closes an issue as the workflow bot, exactly like
# tools/ci/report.sh does. An issue opened with your own account would not
# notify you, so it cannot test this.
name: notification-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issue:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open and close a test issue as the workflow bot
        run: |
          url=$(gh issue create --title "Notification test $(date -u +%F) (please ignore)" \
            --body "Opened by the notification-test workflow to check that pipeline issues reach the maintainer by e-mail. Closed right away.")
          gh issue close "$url" --comment "Test done."
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
